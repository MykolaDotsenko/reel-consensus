name: Update room lockfile

on:
  push:
    branches: [feat/shareable-rooms-foundation]
    paths:
      - "package.json"
      - ".github/workflows/update-room-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/shareable-rooms-foundation

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Update lockfile for Supabase rooms"
          git push
