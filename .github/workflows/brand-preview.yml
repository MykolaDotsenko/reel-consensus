name: Brand preview

on:
  push:
    branches: [brand/reel-consensus-identity]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reel-consensus-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reel-consensus-preview.log
          exit 1

      - name: Capture branded desktop
        run: npm run screenshot

      - name: Upload brand preview
        uses: actions/upload-artifact@v4
        with:
          name: reel-consensus-brand-preview
          path: docs/screenshots/reel-consensus-desktop.png
          if-no-files-found: error
