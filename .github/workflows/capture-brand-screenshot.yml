name: Capture brand screenshot

on:
  push:
    branches: [brand/reel-consensus-identity]
    paths:
      - "src/**"
      - "public/brand/**"
      - "scripts/capture-readme-screenshot.mjs"
      - ".github/workflows/capture-brand-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reel-consensus-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reel-consensus-preview.log
          exit 1

      - name: Capture screenshot
        run: npm run screenshot

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/reel-consensus-desktop.png
          if git diff --cached --quiet; then
            echo "Screenshot is unchanged."
            exit 0
          fi
          git commit -m "Refresh README screenshot with branded UI"
          git push
